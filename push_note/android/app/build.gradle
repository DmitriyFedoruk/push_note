plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}



android {
    namespace = "com.dev.push_note"
    compileSdk = 36
    ndkVersion = '28.0.12433566'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        // Enable core library desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

        flavorDimensions "push_note"

    productFlavors {
        dev {
            applicationId "com.dev.push_note"
            resValue "string", "app_name", "Push Note Dev"
            versionNameSuffix ".dev"
            manifestPlaceholders = [
            'appAuthRedirectScheme': 'com.dev.push_note'
            ]
        }
        prod {
            dimension "airheadmobile"
            applicationIdSuffix ".app"
            resValue "string", "app_name", "Push Note"
            manifestPlaceholders = [
            'appAuthRedirectScheme': 'com.push_note.app'
            ]
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.dev.push_note"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}
