name: push_note
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.1+4

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.4.0
  # path
  path: ^1.9.1
  path_provider: ^2.1.5
  go_router: ^16.2.1
  # DB
  objectbox: ^5.0.0
  objectbox_flutter_libs: ^5.0.0

  provider: ^6.1.5+1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  #localization
  slang: ^4.9.2
  slang_flutter: ^4.9.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  omni_datetime_picker: ^2.3.1
  adaptive_theme: ^3.7.2
  permission_handler: ^12.0.1
  toastification: ^3.0.3
  speech_to_text: ^7.3.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  objectbox_generator: ^5.0.0
  slang_build_runner: ^4.9.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 24 
  adaptive_icon_background: "#BFD7EA"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets: 
    - assets/
    - assets/icons/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue/BebasNeue-Thin.otf
          weight: 100
        - asset: assets/fonts/BebasNeue/BebasNeue-Light.otf
          weight: 200
        - asset: assets/fonts/BebasNeue/BebasNeue-Book.otf
          weight: 300
        - asset: assets/fonts/BebasNeue/BebasNeue-Regular.otf
          weight: 400
        - asset: assets/fonts/BebasNeue/BebasNeue-Bold.otf
          weight: 600
    
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto.ttf

