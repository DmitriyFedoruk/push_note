name: push_note
description: "A new Flutter project."
publish_to: 'none'
version: 0.6.1+6

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.2
  # path
  path: ^1.9.1
  path_provider: ^2.1.6
  go_router: ^18.1.0
  # DB
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

  provider: ^6.1.5+1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  #localization
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  omni_datetime_picker: ^2.3.2
  adaptive_theme: ^3.8.0
  permission_handler: ^13.0.2
  toastification: ^3.2.0
  speech_to_text: ^7.5.0
  #Animate for state when record audio
  avatar_glow: ^3.0.1
  #Use for progress screen
  fl_chart: ^1.2.0
  material_ui: ^1.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  objectbox_generator: ^5.3.2
  slang_build_runner: ^4.19.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 24 
  adaptive_icon_background: "#BFD7EA"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets: 
    - assets/
    - assets/icons/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue/BebasNeue-Thin.otf
          weight: 100
        - asset: assets/fonts/BebasNeue/BebasNeue-Light.otf
          weight: 200
        - asset: assets/fonts/BebasNeue/BebasNeue-Book.otf
          weight: 300
        - asset: assets/fonts/BebasNeue/BebasNeue-Regular.otf
          weight: 400
        - asset: assets/fonts/BebasNeue/BebasNeue-Bold.otf
          weight: 600
    
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto.ttf

